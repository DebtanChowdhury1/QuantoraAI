services:
  - type: web
    name: quantora-ai-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DNS_SERVERS
        value: 8.8.8.8,1.1.1.1
      - key: AI_PROVIDER
        value: auto
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_FALLBACK_PORT
        value: 465
      - key: CLERK_FRONTEND_API
        sync: false
      - key: CLERK_API_KEY
        sync: false
      - key: COINGECKO_API
        value: https://api.coingecko.com
      - key: USE_COINGECKO_PRIMARY
        value: true
      - key: COINGECKO_REQUEST_DELAY_MS
        value: 1500
      - key: COINGECKO_RETRY_ATTEMPTS
        value: 2
      - key: COINGECKO_RETRY_DELAY_MS
        value: 10000
      - key: MARKET_DATA_CACHE_SECONDS
        value: 2
      - key: MARKETS_REFRESH_MIN
        value: 1
      - key: ENABLE_PREDICTION_CRON
        value: true
      - key: PREDICT_REFRESH_MIN
        value: 10
      - key: AI_SIGNAL_CACHE_SECONDS
        value: 2
      - key: PREDICT_COINS_PER_CYCLE
        value: 10
      - key: MAX_GEMINI_REQ_PER_DAY
        value: 800
      - key: MAX_COINGECKO_REQ_PER_DAY
        value: 250
      - key: EMAIL_MAX_PER_DAY
        value: 100
      - key: EMAIL_MIN_GAP_MIN
        value: 60
      - key: SEND_EMAIL_ON_CHANGE_ONLY
        value: true
      - key: RAW_PREDICTION_RETENTION_DAYS
        value: 90
      - key: ROLLUP_INTERVAL_HOURS
        value: 1
      - key: ENABLE_CLOUDINARY
        value: false
      - key: COINS
        value: bitcoin,ethereum,binancecoin,solana,ripple,dogecoin,cardano,tron,avalanche-2,chainlink,polkadot,litecoin,bitcoin-cash,stellar,near,uniswap,aptos,arbitrum,optimism,shiba-inu,sui,hedera,the-open-network,pepe,internet-computer,filecoin,render-token,cosmos,injective-protocol,aave,maker,lido-dao,ethereum-classic,vechain,algorand,quant-network,polygon-ecosystem-token,immutable-x,fetch-ai,celestia,sei-network,bonk,floki

  - type: web
    name: quantora-ai-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
